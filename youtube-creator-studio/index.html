<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence Creator Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0e10;--panel:#11171a;--panel2:#161e22;--line:#25333a;--muted:#8a9aa1;--text:#f3f5f9;--text2:#c3cad6;
  --accent:#2bb3a3;--accent2:#5fd4c5;--onAccent:#04201c;--accentSoft:#0f2b2a;--accentLine:#1f5752;
  --display:"Bricolage Grotesque",Figtree,system-ui,sans-serif;
  --red:#ff4e45;--good:#1fb57a;--warn:#e0a100;--bad:#e66767;
  --long:#3987e5;--short:#d95926;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f3f6f6;--panel:#ffffff;--panel2:#f6f9f9;--line:#d9e2e3;--muted:#56666b;--text:#0e1517;--text2:#34454a;
    --accent:#0e8577;--accent2:#0b6d62;--onAccent:#ffffff;--accentSoft:#e2f4f1;--accentLine:#a3d9d1;
    --long:#2a78d6;--short:#eb6834;
    --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f6f6;--panel:#ffffff;--panel2:#f6f9f9;--line:#d9e2e3;--muted:#56666b;--text:#0e1517;--text2:#34454a;
  --accent:#0e8577;--accent2:#0b6d62;--onAccent:#ffffff;--accentSoft:#e2f4f1;--accentLine:#a3d9d1;
  --long:#2a78d6;--short:#eb6834;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Figtree,system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,.big,.kpi .value,.brand b{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.active{background:var(--accentSoft);border-color:var(--accentLine);color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}h3{font-size:13px;margin:0 0 8px;color:var(--text2)}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi .value{font-size:26px;font-weight:750;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .hint{color:var(--muted);font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accentLine)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:650}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:16px;border:1px solid var(--accentLine);background:var(--accentSoft);border-radius:10px}
.banner span{flex:1;min-width:200px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
label.f>span.row{display:flex}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{width:auto}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--good)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--text2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;min-width:0}
.item:hover{border-color:var(--accentLine)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted)}
.fmt{width:6px;align-self:stretch;border-radius:3px;background:var(--long)}
.fmt.short{background:var(--short)}
.empty{color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{color:var(--muted);font-size:11px;text-transform:uppercase;padding:4px 6px}
.day{min-height:112px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.day.out{opacity:.45}
.day.today{border-color:var(--accent)}
.day.drop{background:var(--accentSoft)}
.day .n{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.chip{font-size:11px;padding:3px 6px;border-radius:5px;background:var(--panel2);border-left:3px solid var(--long);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.chip.short{border-left-color:var(--short)}
.chip.pub{opacity:.6;text-decoration:line-through}
.slot{font-size:10px;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:2px 5px;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* board */
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:300px}
.col.drop{background:var(--accentSoft)}
.col h3{display:flex;justify-content:space-between;margin:2px 4px 8px}
.kcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab;border-left:3px solid var(--long)}
.kcard.short{border-left-color:var(--short)}
.kcard b{display:block;font-size:13px;margin-bottom:4px;word-break:break-word}
.kcard small{color:var(--muted);font-size:11px}

/* modal */
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.dialog{width:min(860px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.dialog .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.meter .bar{flex:1}
.tips{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12px}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.checks input{margin-top:3px}
.toggles{display:flex;gap:4px;flex-wrap:wrap}
.toggles button{min-width:44px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer}
.toggles button.on{background:var(--accentSoft);border-color:var(--accent)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:80;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.stream{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stream:last-child{border-bottom:0}
.stream .t{flex:1}
.stream small{color:var(--muted);display:block}
.note{font-size:12px;color:var(--muted)}
.big{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px #0005;display:none;z-index:5;min-width:150px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
pre.copy{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,monospace;max-height:260px;overflow:auto}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.checks{grid-template-columns:1fr}}
@media(max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .day{min-height:64px;padding:3px}.chip{font-size:9px;padding:2px 3px}.slot{display:none}
  .dow{font-size:9px;padding:2px}
  .brand small{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="2" fill="none" stroke="var(--onAccent)" stroke-width="1.8"/><path d="M3 8.5h14M7 3v3M13 3v3" stroke="var(--onAccent)" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 12.3l1.8 1.7 3.3-3.4" fill="none" stroke="var(--onAccent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><b id="brandName">Cadence</b><small>Plan · Schedule · Monetize</small></div>
  </div>
  <nav id="nav">
    <button data-view="dashboard">Dashboard</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="pipeline">Pipeline</button>
    <button data-view="monetize">Monetization</button>
    <button data-view="income">Income</button>
    <button data-view="sponsors">Sponsors</button>
    <button data-view="settings">Settings</button>
  </nav>
  <button class="btn primary" id="newVideo">+ New video</button>
</header>
<main id="view"></main>

<div class="modal" id="modal"><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="confirm" style="z-index:70"><div class="dialog" style="width:min(420px,100%)" role="alertdialog" aria-modal="true" aria-labelledby="confirmMsg"><p id="confirmMsg" style="margin:0 0 14px;font-weight:600"></p><div class="foot"><button class="btn" id="confirmNo">Cancel</button><button class="btn primary" id="confirmYes" style="background:var(--bad);border-color:var(--bad);color:#fff">Delete</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="lib.js"></script>
<script>
'use strict';
const L = window.YTLib;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const money = (n, d = 0) => '$' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtN = (n) => (Number(n) || 0).toLocaleString();
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const pad = (n) => String(n).padStart(2, '0');
const toLocalInput = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${L.dateKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDate = (iso, opts = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) => iso ? new Date(iso).toLocaleString(undefined, opts) : 'Unscheduled';
const SOURCE_COLOR = Object.fromEntries(L.INCOME_SOURCES.map((s, i) => [s, `var(--s${i + 1})`]));

/* ---------- state ---------- */
const KEY = 'ytcs-v1';
const DEFAULTS = {
  channel: { name: 'My Channel', niche: 'Education / how-to', subs: 0, watchHours: 0, shortsViews90: 0, uploads90: 0, avgViews: 0,
    monthlyLongViews: 0, monthlyShortViews: 0, rpmLong: '', rpmShort: '', incomeGoal: 1000, handle: '', apiKey: '' },
  cadence: { long: [2, 5], longTime: '17:00', short: [1, 3, 5], shortTime: '12:00' },
  videos: [], income: [], deals: [], reminded: {}, prefs: { notify: false },
};
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { S = null; }
const normalize = (d) => ({ ...structuredClone(DEFAULTS), ...d, channel: { ...DEFAULTS.channel, ...d.channel }, cadence: { ...DEFAULTS.cadence, ...d.cadence }, prefs: { ...DEFAULTS.prefs, ...d.prefs } });
const firstRun = !S;
S = S ? normalize(S) : structuredClone(DEFAULTS);
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!cloud) toast('Couldn\'t save: this browser is blocking storage. Download a backup from Settings to keep your work.'); }
  clearTimeout(save.t); save.t = setTimeout(pushCloud, 1500);
}

/* Account sync: on claude.ai the page can keep a private copy per signed-in person,
   so the same data shows up on every device. Locally this is a no-op. */
let cloud = null, cloudState = 'local';
async function initCloud() {
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = db && user ? await user.id() : null;
    if (!id) return;
    const ref = db.collection('data/users/' + id).doc('state');
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    cloud = ref; cloudState = 'synced';
    if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
      S = normalize(JSON.parse(remote.json));
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* cloud copy is enough */ }
      render(); toast('Loaded your data from your account');
    } else { render(); pushCloud(); }
  } catch (e) { cloudState = 'local'; }
}
async function pushCloud() {
  if (!cloud || S.isDemo) return;
  try { await cloud.set({ json: JSON.stringify(S), updatedAt: S.updatedAt || Date.now() }); cloudState = 'synced'; }
  catch (e) { if (cloudState !== 'error') toast('Couldn\'t sync to your account. Your changes are still saved in this browser.'); cloudState = 'error'; }
}
function commit() { save(); render(); }

let view = (location.hash.slice(1) || 'dashboard');
let calMonth = new Date(); calMonth.setDate(1);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }
async function download(name, text, type = 'text/plain') {
  if (!window.claude?.use) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return;
  }
  const dl = name.endsWith('.ics') ? null : await window.claude.use('downloads');
  if (dl) {
    try { await dl.save({ filename: name, data: text }); return; }
    catch (e) { if (e?.code === 'declined') return; if (e?.code === 'rate_limited') return toast('A save is already waiting for your answer.'); }
  }
  openModal(`<div class="row"><h2 style="margin:0">Save ${esc(name)}</h2><span class="spacer"></span><button class="btn sm" id="xClose" aria-label="Close">✕</button></div>
    <p class="note">This page can't save this file type directly. Copy the text, paste it into a plain-text editor and save it as <b>${esc(name)}</b>.${name.endsWith('.ics') ? ' Then open that file to add the schedule to Google, Apple or Outlook Calendar.' : ''}</p>
    <textarea id="xText" readonly style="min-height:260px;font:12px/1.5 ui-monospace,monospace">${esc(text)}</textarea>
    <div class="foot"><button class="btn primary" id="xCopy">Copy text</button></div>`, (d) => {
    $('#xClose', d).onclick = closeModal;
    $('#xCopy', d).onclick = () => { const t = $('#xText', d); copy(t.value); t.select(); };
  });
}
function askConfirm(message, yesLabel, onYes) {
  const c = $('#confirm');
  $('#confirmMsg').textContent = message; $('#confirmYes').textContent = yesLabel;
  c.classList.add('open'); $('#confirmNo').focus();
  $('#confirmYes').onclick = () => { c.classList.remove('open'); onYes(); };
  $('#confirmNo').onclick = () => c.classList.remove('open');
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); } catch (e) { toast('Your browser blocked copying. Select the text and copy it yourself.'); } }

const rpm = () => { const n = L.NICHES[S.channel.niche] || L.NICHES.Other; return { long: Number(S.channel.rpmLong) || n.long, short: Number(S.channel.rpmShort) || n.short }; };
const uploads90App = () => S.videos.filter((v) => v.status === 'Published' && v.publishAt && Date.now() - new Date(v.publishAt) < 90 * 864e5 && new Date(v.publishAt) <= new Date()).length;
const sortedUpcoming = () => S.videos.filter((v) => v.status !== 'Published' && v.publishAt).sort((a, b) => new Date(a.publishAt) - new Date(b.publishAt));
const monthKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const incomeIn = (key) => S.income.filter((e) => (e.date || '').startsWith(key)).reduce((a, e) => a + (Number(e.amount) || 0), 0);

/* ---------- views ---------- */
const VIEWS = {};

VIEWS.dashboard = () => {
  const up = sortedUpcoming();
  const next = up.find((v) => new Date(v.publishAt) >= new Date());
  const ypp = L.yppProgress({ ...S.channel, uploads90: Math.max(S.channel.uploads90, uploads90App()) });
  const full = ypp[1];
  const perWeek = S.cadence.long.length + S.cadence.short.length;
  const cons = L.consistency(S.videos, perWeek);
  const thisMonth = incomeIn(monthKey());
  const goal = Number(S.channel.incomeGoal) || 0;
  const actions = buildActions();
  const slotsL = L.nextSlots(S.videos, { days: S.cadence.long, time: S.cadence.longTime, format: 'long' }, new Date(), 3);
  const slotsS = L.nextSlots(S.videos, { days: S.cadence.short, time: S.cadence.shortTime, format: 'short' }, new Date(), 3);
  const slots = [...slotsL.map((d) => ({ d, f: 'long' })), ...slotsS.map((d) => ({ d, f: 'short' }))].sort((a, b) => a.d - b.d).slice(0, 5);
  return `
  <h1>${esc(S.channel.name)}</h1><p class="sub">Your channel at a glance — what's next, what's due, and how close you are to getting paid.</p>
  <div class="grid g4">
    <div class="card kpi"><div class="label">Next upload</div><div class="value" style="font-size:18px">${next ? esc(next.title || 'Untitled') : '—'}</div><div class="hint">${next ? `${fmtDate(next.publishAt)} · ${countdown(next.publishAt)}` : 'Nothing scheduled yet'}</div></div>

function countdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms < 0) return 'overdue';
  const h = Math.floor(ms / 36e5);
  return h < 24 ? `in ${h}h ${Math.floor(ms % 36e5 / 6e4)}m` : `in ${Math.floor(h / 24)}d ${h % 24}h`;
}

function videoItem(v) {
  const overdue = v.publishAt && new Date(v.publishAt) < new Date() && v.status !== 'Published';
  return `<div class="item" data-edit="${v.id}"><span class="fmt ${v.format === 'short' ? 'short' : ''}"></span><div class="t"><b>${esc(v.title || 'Untitled video')}</b><small>${fmtDate(v.publishAt)}${v.dealId ? ' · Sponsored' : ''}</small></div><span class="pill ${overdue ? 'bad' : v.status === 'Scheduled' || v.status === 'Ready' ? 'good' : ''}">${overdue ? 'Overdue · ' : ''}${esc(v.status)}</span></div>`;
}

function buildActions() {
  const out = [], now = Date.now();
  for (const v of sortedUpcoming()) {
    const h = (new Date(v.publishAt) - now) / 36e5;
    if (h < 0) out.push({ level: 'bad', tag: 'Overdue', title: v.title || 'Untitled video', detail: `Was due ${fmtDate(v.publishAt)} — publish or reschedule`, go: 'edit', id: v.id });
    else if (h < 72 && !['Ready', 'Scheduled'].includes(v.status)) out.push({ level: 'warn', tag: 'Due soon', title: v.title || 'Untitled video', detail: `${countdown(v.publishAt)} and still in ${v.status}`, go: 'edit', id: v.id });
    else if (h < 168) {
      const missing = L.CHECKLIST.filter(([k]) => !(v.checklist || {})[k] && !(k === 'disclosure' && !v.dealId) && !(k === 'chapters' && v.format === 'short')).length;
      if (missing > 3) out.push({ level: 'warn', tag: 'Checklist', title: v.title || 'Untitled video', detail: `${missing} pre-publish items not done`, go: 'edit', id: v.id });
    }
  }
  for (const d of S.deals) {
    if (d.stage === 'Paid') continue;
    if (d.due && new Date(d.due + 'T23:59') < new Date() && d.stage !== 'Delivered') out.push({ level: 'bad', tag: 'Sponsor', title: d.brand, detail: `Deliverable was due ${d.due}`, go: 'deal', id: d.id });
    else if (d.stage === 'Delivered') out.push({ level: 'warn', tag: 'Invoice', title: d.brand, detail: `Delivered — chase payment of ${money(d.amount)}`, go: 'deal', id: d.id });
  }
  const ypp = L.yppProgress({ ...S.channel, uploads90: Math.max(S.channel.uploads90, uploads90App()) });
  if (!S.channel.subs && !S.channel.watchHours) out.push({ level: 'warn', tag: 'Setup', title: 'Enter your channel stats', detail: 'So the app can track Partner Program progress', go: 'monetize' });
  else if (ypp[1].eligible) out.push({ level: 'good', tag: 'YPP', title: 'You meet the Partner Program thresholds', detail: 'Apply in YouTube Studio → Earn', go: 'monetize' });
  return out.slice(0, 8);
}

VIEWS.calendar = () => {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const today = L.dateKey(new Date());
  const byDay = {};
  for (const v of S.videos) if (v.publishAt) (byDay[L.dateKey(new Date(v.publishAt))] ||= []).push(v);
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = L.dateKey(d), list = (byDay[k] || []).sort((a, b) => new Date(a.publishAt) - new Date(b.publishAt));
    const future = d >= new Date(new Date().toDateString());
    const hasL = list.some((v) => v.format !== 'short'), hasS = list.some((v) => v.format === 'short');
    const slots = future ? [S.cadence.long.includes(d.getDay()) && !hasL ? 'Long slot' : '', S.cadence.short.includes(d.getDay()) && !hasS ? 'Short slot' : ''].filter(Boolean) : [];
    cells += `<div class="day ${d.getMonth() !== m ? 'out' : ''} ${k === today ? 'today' : ''}" data-day="${k}">
      <div class="n"><span>${d.getDate()}</span></div>
      ${list.map((v) => `<div class="chip ${v.format === 'short' ? 'short' : ''} ${v.status === 'Published' ? 'pub' : ''}" draggable="true" data-edit="${v.id}" title="${esc(v.title)} — ${esc(v.status)}">${new Date(v.publishAt).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })} ${esc(v.title || 'Untitled')}</div>`).join('')}
      ${slots.map((s) => `<div class="slot">+ ${s}</div>`).join('')}
    </div>`;
  }
  return `
  <h1>Content calendar</h1><p class="sub">Click a day to plan a video, drag videos to reschedule. Dashed boxes are open slots from your posting cadence.</p>
  <div class="cal-head">
    <button class="btn" id="calPrev" aria-label="Previous month">‹</button>

    <button class="btn" id="calToday">Today</button>
    <span class="spacer"></span>

    <button class="btn" id="icsExport">Export to Google/Apple Calendar (.ics)</button>

function incomeChart(rows) {
  const sources = L.INCOME_SOURCES.filter((s) => rows.some((r) => r.bySource[s]));
  if (!sources.length) return '<div class="empty">Add income entries to see your chart.</div>';
  const W = 900, H = 260, P = { l: 52, r: 8, t: 10, b: 28 };
  const max = Math.max(...rows.map((r) => r.total), Number(S.channel.incomeGoal) || 0) * 1.1 || 1;
  const step = niceStep(max / 4);
  const top = Math.ceil(max / step) * step;
  const y = (v) => P.t + (H - P.t - P.b) * (1 - v / top);
  const bw = (W - P.l - P.r) / rows.length, barW = Math.min(44, bw * 0.62);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${money(v)}</text>`;
  const goal = Number(S.channel.incomeGoal) || 0;
  if (goal) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--text2)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W - P.r}" y="${y(goal) - 5}" text-anchor="end" font-size="11" fill="var(--text2)">Goal ${money(goal)}</text>`;
  rows.forEach((r, i) => {
    const x = P.l + i * bw + (bw - barW) / 2;
    let acc = 0;
    const segs = sources.filter((s) => r.bySource[s] > 0);
    segs.forEach((s, j) => {
      const v = r.bySource[s], y0 = y(acc), y1 = y(acc + v);
      const h = Math.max(0, y0 - y1 - (j ? 2 : 0));
      const isTop = j === segs.length - 1, rr = isTop ? Math.min(4, h) : 0;
      const yb = y0 - (j ? 2 : 0);
      g += `<path d="M${x},${yb} V${yb - h + rr} Q${x},${yb - h} ${x + rr},${yb - h} H${x + barW - rr} Q${x + barW},${yb - h} ${x + barW},${yb - h + rr} V${yb} Z" fill="${SOURCE_COLOR[s]}"/>`;
      acc += v;
    });
    const [yy, mm] = r.month.split('-');
    g += `<text x="${x + barW / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(+yy, +mm - 1, 1).toLocaleString(undefined, { month: 'short' })}</text>`;
    g += `<rect x="${P.l + i * bw}" y="${P.t}" width="${bw}" height="${H - P.t - P.b}" fill="transparent" data-bar="${i}"/>`;
  });
  incomeChart.rows = rows; incomeChart.sources = sources;
  return `<div class="legend" style="margin-bottom:8px">${sources.map((s) => `<span><i style="background:${SOURCE_COLOR[s]}"></i>${esc(s)}</span>`).join('')}</div>
    <div class="chart" id="incChart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked bar chart of income per month by source; the full list is in the table below">${g}</svg><div class="tip" id="incTip"></div></div>`;
}
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw || 1)); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

    ${[...S.deals].sort((a, b) => L.DEAL_STAGES.indexOf(a.stage) - L.DEAL_STAGES.indexOf(b.stage)).map((d) => {

/* ---------- modals ---------- */
function openModal(html, bind) { $('#dialog').innerHTML = html; $('#modal').classList.add('open'); bind?.($('#dialog')); setTimeout(() => $('#dialog input, #dialog textarea, #dialog select')?.focus(), 0); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('#confirm').classList.contains('open')) $('#confirm').classList.remove('open'); else closeModal(); });

const DESC_TEMPLATE = (v) => `${v.title || 'Video title'} — one-sentence summary with your main keyword${v.keyword ? ` (${v.keyword})` : ''}.

🔗 Links mentioned:
-

💰 Support the channel / tools I use (affiliate links help the channel at no cost to you):
-

0:00 Intro
0:30 Point one
2:00 Point two
5:00 Wrap-up

📬 Business inquiries: your@email.com
#${(v.keyword || 'youtube').replace(/\s+/g, '')}`;

function editVideo(id, preset = {}) {
  const isNew = !id;
  const v = isNew ? { id: uid(), title: '', keyword: '', format: 'long', status: 'Idea', publishAt: '', description: '', tags: '', notes: '', checklist: {}, dealId: '', ...preset } : structuredClone(S.videos.find((x) => x.id === id));
  if (!v) return;
  openModal(`
    <div class="row"><h2 style="margin:0">${isNew ? 'New video' : 'Edit video'}</h2><span class="spacer"></span><button class="btn sm" id="vClose" aria-label="Close">✕</button></div>
    <div class="grid g2" style="margin-top:12px">
      <div>
        <label class="f"><span>Title</span><input id="vTitle" maxlength="100" value="${esc(v.title)}" placeholder="e.g. 7 Budgeting Mistakes That Keep You Broke (2026)"></label>
        <div id="vScore"></div>
        <label class="f" style="margin-top:10px"><span>Target keyword</span><input id="vKeyword" value="${esc(v.keyword)}" placeholder="what would someone type into search?"></label>
        <div class="grid g2" style="gap:10px">
          <label class="f"><span>Format</span><select id="vFormat"><option value="long" ${v.format !== 'short' ? 'selected' : ''}>Long-form</option><option value="short" ${v.format === 'short' ? 'selected' : ''}>Short</option></select></label>
          <label class="f"><span>Status</span><select id="vStatus">${L.STATUSES.map((s) => `<option ${s === v.status ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        </div>
        <label class="f"><span>Publish date & time</span><div class="row" style="flex-wrap:nowrap"><input type="datetime-local" id="vDate" value="${toLocalInput(v.publishAt)}"><button class="btn sm" id="vNextSlot" type="button">Next open slot</button></div></label>
        <label class="f"><span>Sponsor</span><select id="vDeal"><option value="">None</option>${S.deals.map((d) => `<option value="${d.id}" ${d.id === v.dealId ? 'selected' : ''}>${esc(d.brand)} (${esc(d.stage)})</option>`).join('')}</select></label>
        <label class="f"><span>Notes / script outline</span><textarea id="vNotes" placeholder="Hook, key points, B-roll ideas…">${esc(v.notes)}</textarea></label>
      </div>
      <div>
        <label class="f"><span class="row"><span>Description</span><span class="spacer"></span><button class="btn sm" type="button" id="vTpl">Insert template</button></span><textarea id="vDesc" style="min-height:170px">${esc(v.description)}</textarea></label>
        <div id="vChapters" class="note"></div>
        <label class="f" style="margin-top:10px"><span class="row"><span>Tags (comma separated)</span><span class="spacer"></span><button class="btn sm" type="button" id="vGenTags">Generate</button></span><textarea id="vTags" style="min-height:60px">${esc(v.tags)}</textarea></label>
        <div id="vTagCount" class="note"></div>
      </div>
    </div>
    <h3 style="margin-top:10px">Pre-publish checklist</h3>
    <div class="checks">${L.CHECKLIST.map(([k, label]) => `<label><input type="checkbox" data-ck="${k}" ${v.checklist?.[k] ? 'checked' : ''}> ${label}</label>`).join('')}</div>
    <div class="foot">
      ${isNew ? '' : '<button class="btn danger" id="vDelete">Delete</button><button class="btn" id="vDup">Duplicate</button>'}
      <button class="btn" id="vCopy">Copy for YouTube Studio</button>
      <span class="spacer"></span>
      <button class="btn primary" id="vSave">Save</button>
    </div>`, (d) => {
    const read = () => {
      v.title = $('#vTitle', d).value.trim(); v.keyword = $('#vKeyword', d).value.trim(); v.format = $('#vFormat', d).value; v.status = $('#vStatus', d).value;
      const dv = $('#vDate', d).value; v.publishAt = dv ? new Date(dv).toISOString() : ''; v.dealId = $('#vDeal', d).value;
      v.notes = $('#vNotes', d).value; v.description = $('#vDesc', d).value; v.tags = $('#vTags', d).value;
      v.checklist = Object.fromEntries($$('[data-ck]', d).map((c) => [c.dataset.ck, c.checked]));
      return v;
    };
    const score = () => {
      const r = L.titleScore($('#vTitle', d).value, $('#vKeyword', d).value);
      $('#vScore', d).innerHTML = `<div class="meter"><span>Title score</span><div class="bar ${r.score >= 70 ? 'ok' : ''}"><i style="width:${r.score}%"></i></div><b>${r.score}</b><span>${r.len}/100</span></div>${r.tips.length ? `<ul class="tips">${r.tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}`;
    };
    const chap = () => {
      if ($('#vFormat', d).value === 'short') { $('#vChapters', d).textContent = ''; return; }
      const r = L.checkChapters($('#vDesc', d).value);
      $('#vChapters', d).innerHTML = r.ok ? `<span class="pill good">✓ ${r.count} chapters</span>` : `Chapters: ${r.problems.map(esc).join(' ')}`;
    };
    const tagCount = () => {
      const tags = $('#vTags', d).value.split(',').map((t) => t.trim()).filter(Boolean);
      const n = tags.reduce((a, t, i) => a + t.length + (t.includes(' ') ? 2 : 0) + (i ? 1 : 0), 0);
      $('#vTagCount', d).innerHTML = `${tags.length} tags · <span style="color:${n > 500 ? 'var(--bad)' : 'inherit'}">${n}/500 characters</span>`;
    };
    score(); chap(); tagCount();
    $('#vTitle', d).oninput = $('#vKeyword', d).oninput = score;
    $('#vDesc', d).oninput = chap; $('#vFormat', d).onchange = chap; $('#vTags', d).oninput = tagCount;
    $('#vClose', d).onclick = closeModal;
    $('#vTpl', d).onclick = () => { read(); const ta = $('#vDesc', d); ta.value = DESC_TEMPLATE(v) + (ta.value ? '\n\n' + ta.value : ''); chap(); };
    $('#vGenTags', d).onclick = () => { read(); $('#vTags', d).value = L.generateTags(v.title, v.keyword, S.channel.niche).join(', '); tagCount(); };
    $('#vNextSlot', d).onclick = () => {
      const f = $('#vFormat', d).value, cad = S.cadence;
      const others = S.videos.filter((x) => x.id !== v.id);
      const [s] = L.nextSlots(others, { days: f === 'short' ? cad.short : cad.long, time: f === 'short' ? cad.shortTime : cad.longTime, format: f }, new Date(), 1);
      if (s) $('#vDate', d).value = toLocalInput(s.toISOString()); else toast('Set your posting days in Settings first.');
    };
    $('#vCopy', d).onclick = () => { read(); copy(`TITLE:\n${v.title}\n\nDESCRIPTION:\n${v.description}\n\nTAGS:\n${v.tags}`); };
    $('#vSave', d).onclick = () => {
      read();
      if (v.status === 'Published' && !v.publishAt) v.publishAt = new Date().toISOString();
      const i = S.videos.findIndex((x) => x.id === v.id);
      if (i >= 0) S.videos[i] = v; else S.videos.push(v);
      closeModal(); commit(); toast(isNew ? 'Video added' : 'Video saved');
    };
    if (!isNew) {
      $('#vDelete', d).onclick = () => { askConfirm('Delete this video? This can\'t be undone.', 'Delete video', () => { S.videos = S.videos.filter((x) => x.id !== v.id); closeModal(); commit(); toast('Video deleted'); }); };
      $('#vDup', d).onclick = () => { read(); const c = { ...structuredClone(v), id: uid(), title: v.title + ' (copy)', status: 'Idea', publishAt: '', checklist: {} }; S.videos.push(c); closeModal(); commit(); editVideo(c.id); };
    }
  });
}

function editDeal(id) {
  const isNew = !id;
  const d0 = isNew ? { id: uid(), brand: '', contact: '', stage: 'Prospect', deliverable: 'Integration (60–90s)', amount: '', due: '', notes: '' } : structuredClone(S.deals.find((x) => x.id === id));
  if (!d0) return;
  const suggest = L.sponsorRate(S.channel.avgViews, d0.deliverable);
  openModal(`
    <div class="row"><h2 style="margin:0">${isNew ? 'New sponsor deal' : esc(d0.brand)}</h2><span class="spacer"></span><button class="btn sm" id="dClose" aria-label="Close">✕</button></div>
    <div class="grid g2" style="margin-top:12px;gap:10px">
      <label class="f"><span>Brand</span><input id="dBrand" value="${esc(d0.brand)}" required></label>
      <label class="f"><span>Contact (email / name)</span><input id="dContact" value="${esc(d0.contact)}"></label>
      <label class="f"><span>Stage</span><select id="dStage">${L.DEAL_STAGES.map((s) => `<option ${s === d0.stage ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label class="f"><span>Deliverable</span><select id="dDel">${Object.keys(L.DELIVERABLES).map((s) => `<option ${s === d0.deliverable ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      <label class="f"><span>Amount ($)</span><input id="dAmount" type="number" min="0" value="${esc(d0.amount)}" placeholder="${S.channel.avgViews ? `suggested ${money(suggest.low)}–${money(suggest.high)}` : ''}"></label>
      <label class="f"><span>Deliverable due</span><input id="dDue" type="date" value="${esc(d0.due)}"></label>
    </div>
    <label class="f"><span>Notes (talking points, usage rights, payment terms…)</span><textarea id="dNotes">${esc(d0.notes)}</textarea></label>
    <p class="note">Moving a deal to <b>Paid</b> automatically logs the amount in Income.</p>
    <div class="foot">${isNew ? '' : '<button class="btn danger" id="dDelete">Delete</button>'}<span class="spacer"></span><button class="btn primary" id="dSave">Save</button></div>`, (m) => {
    $('#dClose', m).onclick = closeModal;
    $('#dSave', m).onclick = () => {
      const d = { ...d0, brand: $('#dBrand', m).value.trim() || 'Unnamed brand', contact: $('#dContact', m).value.trim(), stage: $('#dStage', m).value, deliverable: $('#dDel', m).value, amount: $('#dAmount', m).value, due: $('#dDue', m).value, notes: $('#dNotes', m).value };
      if (d.stage === 'Paid' && d0.stage !== 'Paid' && Number(d.amount) > 0 && !S.income.some((e) => e.dealId === d.id)) {
        S.income.push({ id: uid(), date: L.dateKey(new Date()), source: 'Sponsorship', amount: Number(d.amount), note: d.brand, dealId: d.id });
        toast(`Logged ${money(d.amount)} from ${d.brand} in Income`);
      } else toast('Deal saved');
      const i = S.deals.findIndex((x) => x.id === d.id);
      if (i >= 0) S.deals[i] = d; else S.deals.push(d);
      closeModal(); commit();
    };
    if (!isNew) $('#dDelete', m).onclick = () => { askConfirm('Delete this deal?', 'Delete deal', () => { S.deals = S.deals.filter((x) => x.id !== d0.id); S.videos.forEach((v) => { if (v.dealId === d0.id) v.dealId = ''; }); closeModal(); commit(); toast('Deal deleted'); }); };
  });
}

/* ---------- rendering & events ---------- */
function render() {
  if (!VIEWS[view]) view = 'dashboard';
  $$('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  $('#brandName').textContent = S.channel.name && S.channel.name !== 'My Channel' ? S.channel.name : 'Cadence';
  const y = scrollY;
  $('#view').innerHTML = (S.isDemo ? '<div class="banner" role="note"><span><b>You\'re looking at example data</b> for a made-up finance channel. Explore, then clear it to start planning your own channel.</span><button class="btn primary sm" id="startFresh">Clear examples and start</button></div>' : '') + VIEWS[view]();
  $('#startFresh')?.addEventListener('click', () => { S = structuredClone(DEFAULTS); go('settings'); save(); toast('Examples cleared. Start by naming your channel.'); });
  scrollTo(0, y);
  bindView();
}

function go(v) { view = v; try { history.replaceState(null, '', '#' + v); } catch (e) { /* hash is optional */ } scrollTo(0, 0); render(); }
$('#nav').onclick = (e) => { const b = e.target.closest('button[data-view]'); if (b) go(b.dataset.view); };
$('#newVideo').onclick = () => editVideo(null);

function bindView() {
  const root = $('#view');
  root.onclick = (e) => {
    const t = e.target;
    const ed = t.closest('[data-edit]'); if (ed) return editVideo(ed.dataset.edit);
    const act = t.closest('[data-act]'); if (act) { const a = act.dataset.act; return a === 'edit' ? editVideo(act.dataset.id) : a === 'deal' ? editDeal(act.dataset.id) : go(a); }
    const sl = t.closest('[data-slot]'); if (sl) return editVideo(null, { publishAt: sl.dataset.slot, format: sl.dataset.format, status: 'Idea' });
    const day = t.closest('[data-day]');
    if (day) {
      const [yy, mm, dd] = day.dataset.day.split('-').map(Number);
      const dt = new Date(yy, mm - 1, dd);
      const isShort = S.cadence.short.includes(dt.getDay()) && !S.cadence.long.includes(dt.getDay());
      const [h, mi] = (isShort ? S.cadence.shortTime : S.cadence.longTime).split(':').map(Number);
      dt.setHours(h || 0, mi || 0);
      return editVideo(null, { publishAt: dt.toISOString(), format: isShort ? 'short' : 'long' });
    }
    if (t.closest('[data-newidea]')) return editVideo(null, { status: 'Idea' });
    const dl = t.closest('[data-deal]'); if (dl) return editDeal(dl.dataset.deal);
    const di = t.closest('[data-delincome]'); if (di) { S.income = S.income.filter((x) => x.id !== di.dataset.delincome); commit(); return toast('Entry deleted'); }
  };
  // channel fields (monetize + settings)
  $$('[data-ch]', root).forEach((el) => el.addEventListener('change', () => {
    const k = el.dataset.ch; S.channel[k] = el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value; commit();
  }));

  if (view === 'calendar') {
    $('#calPrev').onclick = () => { calMonth.setMonth(calMonth.getMonth() - 1); render(); };
    $('#calNext').onclick = () => { calMonth.setMonth(calMonth.getMonth() + 1); render(); };
    $('#calToday').onclick = () => { calMonth = new Date(); calMonth.setDate(1); render(); };
    $('#icsExport').onclick = () => { if (!S.videos.some((v) => v.publishAt)) return toast('No scheduled videos to export.'); download('youtube-schedule.ics', L.toICS(S.videos), 'text/calendar'); toast('Calendar file downloaded — open it to import'); };
    dnd('.chip', '.day', (id, cell) => {
      const v = S.videos.find((x) => x.id === id), [yy, mm, dd] = cell.dataset.day.split('-').map(Number);
      const d = new Date(v.publishAt); d.setFullYear(yy, mm - 1, dd); v.publishAt = d.toISOString();
      commit(); toast('Rescheduled to ' + fmtDate(v.publishAt));
    });
  }
  if (view === 'pipeline') dnd('.kcard', '.col', (id, col) => {
    const v = S.videos.find((x) => x.id === id); v.status = col.dataset.status;
    if (v.status === 'Published' && !v.publishAt) v.publishAt = new Date().toISOString();
    commit();
  });
  if (view === 'income') {
    $('#incomeForm').onsubmit = (e) => {
      e.preventDefault(); const f = new FormData(e.target);
      S.income.push({ id: uid(), date: f.get('date'), source: f.get('source'), amount: Number(f.get('amount')), note: f.get('note') });
      commit(); toast('Income added');
    };
    $('#incomeCsv').onclick = () => download('youtube-income.csv', L.toCSV(S.income, ['date', 'source', 'amount', 'note']), 'text/csv');
    bindChartHover();
  }
  if (view === 'sponsors') {
    const upd = () => {
      const views = Number($('#rcViews').value) || 0, type = $('#rcType').value;
      if (views !== (Number(S.channel.avgViews) || 0)) { S.channel.avgViews = views; save(); }
      const r = L.sponsorRate(views, type);
      $('#rcOut').textContent = views ? `${money(r.low)} – ${money(r.high)}` : '—';
      const brand = $('#pitchBrand').value.trim() || '[Brand]';
      $('#pitchOut').textContent = `Subject: ${S.channel.name} × ${brand} — partnership idea

Hi ${brand} team,

I run ${S.channel.name}, a YouTube channel about ${S.channel.niche.toLowerCase()} with ${fmtN(S.channel.subs)} subscribers. My videos average ${fmtN(views)} views${S.channel.watchHours ? ` and viewers watched ${fmtN(S.channel.watchHours)} hours in the last year` : ''}.

My audience already asks about [problem ${brand} solves], so I'd love to feature ${brand} in an upcoming video as a ${type.toLowerCase()}. I'd show how I actually use it, with a tracked link and code in the description and pinned comment.

Rate for this placement: ${views ? `${money(r.low)}–${money(r.high)}` : '[your rate]'}. Happy to share my media kit and recent analytics.

Would you be open to a quick chat?

Thanks,
[Your name]
${S.channel.name}`;
    };
    $('#rcViews').oninput = upd; $('#rcType').onchange = upd; $('#pitchBrand').oninput = upd; upd();
    $('#pitchCopy').onclick = () => copy($('#pitchOut').textContent);
    $('#newDeal').onclick = () => editDeal(null);
  }
  if (view === 'settings') {
    $$('[data-cad]').forEach((g) => g.onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const k = g.dataset.cad, d = Number(b.dataset.d), arr = S.cadence[k];
      S.cadence[k] = arr.includes(d) ? arr.filter((x) => x !== d) : [...arr, d].sort();
      commit();
    });
    $$('[data-cadtime]').forEach((el) => el.onchange = () => { S.cadence[el.dataset.cadtime] = el.value; commit(); });
    $('#fetchStats').onclick = fetchStats;
    $('#notifyBtn').onclick = async () => {
      if (!('Notification' in window)) return toast('This browser does not support notifications.');
      const p = await Notification.requestPermission();
      S.prefs.notify = p === 'granted'; commit();
      toast(p === 'granted' ? 'Notifications enabled' : 'Notifications blocked — you\'ll still see in-app reminders.');
    };
    $('#exportJson').onclick = () => download(`cadence-backup-${L.dateKey(new Date())}.json`, JSON.stringify(S, null, 2), 'application/json');
    $('#importJson').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        if (!Array.isArray(d.videos) || !d.channel) throw new Error('bad');
        S = normalize(d);
        commit(); toast('Backup restored');
      } catch (err) { toast('That file is not a valid backup.'); }
    };
    $('#demo').onclick = () => { const load = () => { S = demoData(); commit(); toast('Example data loaded'); }; if (!S.videos.length || S.isDemo) load(); else askConfirm('Replace your videos, income and deals with example data?', 'Load examples', load); };
    $('#reset').onclick = () => askConfirm('Delete all videos, income, deals and settings from this browser?', 'Delete everything', () => { S = structuredClone(DEFAULTS); commit(); toast('Everything deleted'); });
  }
}

function dnd(itemSel, zoneSel, onDrop) {
  let dragId = null;
  $$(itemSel).forEach((el) => {
    el.addEventListener('dragstart', (e) => { dragId = el.dataset.edit; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
  });
  $$(zoneSel).forEach((z) => {
    z.addEventListener('dragover', (e) => { if (dragId) { e.preventDefault(); z.classList.add('drop'); } });
    z.addEventListener('dragleave', () => z.classList.remove('drop'));
    z.addEventListener('drop', (e) => { e.preventDefault(); z.classList.remove('drop'); if (dragId) onDrop(dragId, z); dragId = null; });
  });
}

function bindChartHover() {
  const wrap = $('#incChart'); if (!wrap) return;
  const tip = $('#incTip'), svg = $('svg', wrap);
  const show = (i, evt) => {
    const r = incomeChart.rows[i], [yy, mm] = r.month.split('-');
    tip.innerHTML = `<b>${new Date(+yy, +mm - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' })}</b>` +
      incomeChart.sources.filter((s) => r.bySource[s]).map((s) => `<div><span><i style="background:${SOURCE_COLOR[s]}"></i>${esc(s)}</span><span>${money(r.bySource[s], 2)}</span></div>`).join('') +
      `<div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><b>Total</b><b>${money(r.total, 2)}</b></div>`;
    tip.style.display = 'block';
    const box = wrap.getBoundingClientRect();
    let x = evt.clientX - box.left + 14; if (x + tip.offsetWidth > box.width) x = evt.clientX - box.left - tip.offsetWidth - 14;
    tip.style.left = Math.max(0, x) + 'px'; tip.style.top = Math.max(0, evt.clientY - box.top - 20) + 'px';
  };
  svg.addEventListener('mousemove', (e) => { const b = e.target.closest('[data-bar]'); if (b) show(+b.dataset.bar, e); else tip.style.display = 'none'; });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}

async function fetchStats() {
  const { apiKey, handle } = S.channel;
  if (!apiKey || !handle) return toast('Enter your channel handle and API key first.');
  const h = handle.trim();
  const q = h.startsWith('UC') ? `id=${encodeURIComponent(h)}` : `forHandle=${encodeURIComponent(h.startsWith('@') ? h : '@' + h)}`;
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&${q}&key=${encodeURIComponent(apiKey)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || res.statusText);
    const ch = data.items?.[0]; if (!ch) throw new Error('Channel not found');
    const st = ch.statistics;
    if (!st.hiddenSubscriberCount) S.channel.subs = Number(st.subscriberCount);
    if (S.channel.name === 'My Channel' || !S.channel.name) S.channel.name = ch.snippet.title;
    commit();
    toast(`${ch.snippet.title}: ${fmtN(st.subscriberCount)} subscribers · ${fmtN(st.viewCount)} total views · ${fmtN(st.videoCount)} videos`);
  } catch (e) { toast(e instanceof TypeError ? 'Couldn\'t reach the YouTube API from this page. Run the app locally to use this, or enter your subscriber count by hand.' : 'YouTube API error: ' + e.message); }
}

/* ---------- reminders ---------- */
function checkReminders() {
  const now = Date.now();
  for (const v of S.videos) {
    if (!v.publishAt || ['Ready', 'Scheduled', 'Published'].includes(v.status)) continue;
    const h = (new Date(v.publishAt) - now) / 36e5;
    const key = v.id + '@' + v.publishAt;
    if (h > 0 && h <= 24 && !S.reminded[key]) {
      S.reminded[key] = 1; save();
      const msg = `“${v.title || 'Untitled video'}” goes out ${countdown(v.publishAt)} and is still in ${v.status}.`;
      if (S.prefs.notify && 'Notification' in window && Notification.permission === 'granted') try { new Notification('Upload reminder', { body: msg }); } catch (e) { /* toast below still shows */ }
      toast(msg);
    }
  }
}
